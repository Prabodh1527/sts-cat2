const state = {
  mode: 'dashboard',
  activeTopic: null,
  quizAnswers: {},
  examSet: null,
  examCoding: null,
  examStart: null,
  examDurationMs: 45*60*1000
};

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function code(title, c){
  const id = 'cb-' + Math.random().toString(36).slice(2,9);
  return `<div class="codeblock">
    <div class="cb-head"><span>${esc(title)}</span>
      <button class="cb-copy" onclick="copyCode('${id}', this)">Copy</button>
    </div>
    <pre id="${id}">${esc(c)}</pre>
  </div>`;
}

function copyCode(id, btn){
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.textContent = orig; }, 1200);
  });
}

function setMode(mode, topicId){
  state.mode = mode;
  if (topicId) state.activeTopic = topicId;
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
}

function selectTopic(id, mode){
  state.activeTopic = id;
  state.mode = mode || 'study';
  render();
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
}

function renderSidebar(filter){
  filter = (filter||'').toLowerCase();
  const list = document.getElementById('topic-list');
  let html = '<div class="topic-group-label">Topics (' + TOPICS.length + ')</div>';
  TOPICS.forEach((t,i)=>{
    if (filter && !(t.title.toLowerCase().includes(filter) || t.tag.toLowerCase().includes(filter))) return;
    const active = (state.activeTopic === t.id && state.mode !== 'dashboard' && state.mode !== 'exam');
    html += `<div class="topic-item ${active?'active':''}" onclick="selectTopic('${t.id}','study')">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="dot"></span>
      <span>${esc(t.title)}</span>
    </div>`;
  });
  list.innerHTML = html;
}

function render(){
  const content = document.getElementById('content');
  const crumb = document.getElementById('crumb');
  const gscore = document.getElementById('global-score');
  let totalMcq=0, answeredMcq=0, correctMcq=0;
  TOPICS.forEach(t=>{
    t.mcqs.forEach((q,i)=>{
      totalMcq++;
      const key = `quiz-${t.id}-${i}`;
      if(state.quizAnswers[key]!==undefined){ answeredMcq++; if(state.quizAnswers[key]===q.a) correctMcq++; }
    });
  });
  gscore.textContent = `${answeredMcq}/${totalMcq} MCQs answered \u00b7 ${correctMcq} correct`;

  if (state.mode === 'dashboard'){
    crumb.textContent = 'Home';
    content.innerHTML = renderDashboard();
  } else if (state.mode === 'exam'){
    crumb.textContent = 'Mock Exam Simulator';
    content.innerHTML = renderExam();
    startExamTimer();
  } else {
    const topic = TOPICS.find(t=>t.id===state.activeTopic) || TOPICS[0];
    state.activeTopic = topic.id;
    crumb.textContent = topic.title + ' \u00b7 ' + (state.mode==='study'?'Notes':state.mode==='quiz'?'Quiz':'Coding');
    if (state.mode === 'study') content.innerHTML = renderStudy(topic);
    else if (state.mode === 'quiz') content.innerHTML = renderQuiz(topic);
    else if (state.mode === 'code') content.innerHTML = renderCode(topic);
  }
  renderSidebar(document.getElementById('search-input').value);
}

function renderDashboard(){
  let totalCoding=0;
  TOPICS.forEach(t=> totalCoding += t.coding.length);
  let totalMcq=0;
  TOPICS.forEach(t=> totalMcq += t.mcqs.length);
  let html = `
  <div class="page-tag">Overview</div>
  <h1 class="page-title">Welcome back \u2014 <span class="accent">let's get you exam-ready</span></h1>
  <div class="summary">Everything from your course PPTs, reorganised into notes, reference code, practice MCQs and coding problems \u2014 plus extra practice questions at the same difficulty level for every topic. Use <b>Mock Exam</b> mode to simulate tomorrow's paper (10 MCQs + 2 coding questions, drawn randomly from all topics).</div>
  <div class="stat-row">
    <div class="stat-box"><div class="v">${TOPICS.length}</div><div class="l">Topics</div></div>
    <div class="stat-box"><div class="v">${totalMcq}</div><div class="l">MCQs</div></div>
    <div class="stat-box"><div class="v">${totalCoding}</div><div class="l">Coding Problems</div></div>
  </div>
  <section class="block">
    <h2>All Topics</h2>
    <div class="topic-grid">
      ${TOPICS.map((t,i)=>`<div class="topic-card" onclick="selectTopic('${t.id}','study')">
        <div class="n">${String(i+1).padStart(2,'0')} \u00b7 ${esc(t.tag)}</div>
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.summary)}</p>
      </div>`).join('')}
    </div>
  </section>
  <footer class="credit">DAA / CS Exam Master Hub &middot; Built from your course slide decks</footer>
  `;
  return html;
}

function renderStudy(topic){
  let html = `<div class="page-tag">${esc(topic.tag)}</div>
  <h1 class="page-title">${esc(topic.title)}</h1>
  <div class="summary">${esc(topic.summary)}</div>`;
  html += `<section class="block"><h2>Comprehensive Notes</h2><div class="notes">${topic.notes}</div></section>`;
  if (topic.code && topic.code.length){
    html += `<section class="block"><h2>Reference Code (from PPT)</h2>`;
    topic.code.forEach(c=> html += code(c.t, c.c));
    html += `</section>`;
  }
  html += `<section class="block"><h2>Practice</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" onclick="setMode('quiz')">\uD83D\uDCDD Practice ${topic.mcqs.length} MCQs</button>
      <button class="btn" onclick="setMode('code')">\uD83D\uDCBB Solve ${topic.coding.length} Coding Problems</button>
    </div></section>`;
  return html;
}

function renderQuiz(topic){
  let html = `<div class="page-tag">${esc(topic.tag)} \u00b7 Quiz</div>
  <h1 class="page-title">${esc(topic.title)}</h1>
  <div class="summary">Test your knowledge with questions derived from the course slides.</div>
  <div class="quiz-toolbar">
    <button class="btn" onclick="resetQuiz('${topic.id}')">\u21BA Reset Quiz</button>
    <span class="quiz-progress" id="quiz-score-${topic.id}"></span>
  </div>
  <div id="quiz-body-${topic.id}">`;
  topic.mcqs.forEach((q,i)=> html += renderMcq(topic.id, i, q, 'quiz'));
  html += `</div>`;
  return html;
}

function renderMcq(topicId, idx, q, prefix){
  prefix = prefix || 'quiz';
  const key = `${prefix}-${topicId}-${idx}`;
  const chosen = state.quizAnswers[key];
  let optsHtml = '';
  q.opts.forEach((opt,oi)=>{
    let cls = 'opt';
    if (chosen !== undefined){
      cls += ' disabled';
      if (oi===q.a) cls += ' correct';
      else if (oi===chosen) cls += ' wrong';
    }
    optsHtml += `<div class="${cls}" onclick="answerMcq('${key}','${topicId}',${idx},${oi},'${prefix}')">
      <span class="k">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span></div>`;
  });
  return `<div class="qcard">
    <div class="qmeta">Question ${idx+1}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${optsHtml}
    <div class="qexp ${chosen!==undefined?'show':''}" id="exp-${key}">${chosen!==undefined ? '<b>Explanation:</b> '+esc(q.exp) : ''}</div>
  </div>`;
}

function answerMcq(key, topicId, idx, chosenIdx, prefix){
  if (state.quizAnswers[key] !== undefined) return;
  state.quizAnswers[key] = chosenIdx;
  render();
  updateQuizScore(topicId, prefix);
}

function updateQuizScore(topicId, prefix){
  if (prefix==='exam') return;
  const topic = TOPICS.find(t=>t.id===topicId);
  let answered=0, correct=0;
  topic.mcqs.forEach((q,i)=>{
    const key = `quiz-${topicId}-${i}`;
    if(state.quizAnswers[key]!==undefined){ answered++; if(state.quizAnswers[key]===q.a) correct++; }
  });
  const el = document.getElementById(`quiz-score-${topicId}`);
  if (el) el.textContent = `${answered}/${topic.mcqs.length} answered \u00b7 ${correct} correct`;
}

function resetQuiz(topicId){
  Object.keys(state.quizAnswers).forEach(k=>{ if(k.startsWith(`quiz-${topicId}-`)) delete state.quizAnswers[k]; });
  render();
}

function renderCode(topic){
  let html = `<div class="page-tag">${esc(topic.tag)} \u00b7 Coding Practice</div>
  <h1 class="page-title">${esc(topic.title)}</h1>
  <div class="summary">Practice exam-level problems with full solutions and complexity notes. One is adapted directly from the PPT, the other is extra practice at the same difficulty.</div>`;
  topic.coding.forEach((c,i)=>{
    const diffClass = c.diff==='Easy'?'easy':(c.diff==='Medium'?'med':'hard');
    const sid = `${topic.id}-${i}`;
    html += `<div class="cq">
      <div class="cq-head"><span class="cq-title">${i+1}. ${esc(c.title)}</span><span class="badge ${diffClass}">${esc(c.diff)}</span></div>
      <div class="statement">${esc(c.statement)}</div>
      <div class="io"><span class="lbl">Sample I/O</span><br>${esc(c.io)}</div>
      <button class="reveal-btn" onclick="toggleSolution('${sid}')">\u25B8 Reveal Solution</button>
      <div class="solution" id="sol-${sid}">
        ${code(topic.title+' \u2014 Solution', c.solution)}
        <div style="font-size:12.5px;color:var(--text-dim);"><b>Complexity:</b> ${esc(c.complexity)}</div>
      </div>
    </div>`;
  });
  return html;
}

function toggleSolution(sid){
  const el = document.getElementById('sol-'+sid);
  const btn = el.previousElementSibling;
  const showing = el.classList.toggle('show');
  btn.textContent = showing ? '\u25BE Hide Solution' : '\u25B8 Reveal Solution';
}

/* MOCK EXAM ENGINE */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function generateMockExam(){
  const allMcqs = [];
  TOPICS.forEach(t=> t.mcqs.forEach((q,i)=> allMcqs.push({topicId:t.id, topicTitle:t.title, idx:i, q:q})));
  const allCoding = [];
  TOPICS.forEach(t=> t.coding.forEach((c,i)=> allCoding.push({topicId:t.id, topicTitle:t.title, idx:i, c:c})));
  state.examSet = shuffle(allMcqs).slice(0,10);
  state.examCoding = shuffle(allCoding).slice(0,2);
  state.examAnswers = {};
  state.examStart = Date.now();
  state.examDurationMs = 45*60*1000;
}

function startExamTimer(){
  clearInterval(window._examTimerHandle);
  window._examTimerHandle = setInterval(()=>{
    const el = document.getElementById('exam-timer');
    if(!el || !state.examStart){ clearInterval(window._examTimerHandle); return; }
    const remain = state.examDurationMs - (Date.now()-state.examStart);
    if(remain<=0){ el.textContent = '00:00 \u2014 Time Expired'; clearInterval(window._examTimerHandle); return; }
    const m = Math.floor(remain/60000), s = Math.floor((remain%60000)/1000);
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} remaining`;
  }, 1000);
}

function renderExam(){
  if(!state.examSet) generateMockExam();
  let correct=0, answered=0;
  state.examSet.forEach((item)=>{
    const key = `exam-${item.topicId}-${item.idx}`;
    if(state.quizAnswers[key]!==undefined){ answered++; if(state.quizAnswers[key]===item.q.a) correct++; }
  });
  let html = `<div class="page-tag">Exam Simulation Mode</div>
  <h1 class="page-title">Tomorrow's Test Simulator \u2014 <span class="accent">10 MCQs + 2 Coding</span></h1>
  <div class="summary">A randomly generated exam set drawn from every topic in this hub. Regenerate as many times as you like for fresh practice sets.</div>
  <div class="quiz-toolbar">
    <button class="btn primary" onclick="generateMockExam(); render();">\uD83D\uDD04 Generate New Exam Set</button>
    <span class="quiz-progress" id="exam-timer">45:00 remaining</span>
    <span class="quiz-progress">${answered}/10 MCQs Answered \u00b7 ${correct} Correct</span>
  </div>
  <section class="block"><h2>Part A \u2014 10 MCQs</h2>`;
  state.examSet.forEach((item,i)=>{
    html += `<div style="font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin:${i===0?'0':'14px'} 0 -6px 4px;">Module: ${esc(item.topicTitle)}</div>`;
    html += renderMcq(item.topicId, item.idx, item.q, 'exam');
  });
  html += `</section><section class="block"><h2>Part B \u2014 2 Coding Questions</h2>`;
  state.examCoding.forEach((item,i)=>{
    const c = item.c;
    const diffClass = c.diff==='Easy'?'easy':(c.diff==='Medium'?'med':'hard');
    const sid = `exam-${item.topicId}-${item.idx}`;
    html += `<div class="cq">
      <div class="cq-head"><span class="cq-title">${i+1}. ${esc(c.title)} <span style="color:var(--text-faint);font-weight:400;font-size:12px;">(${esc(item.topicTitle)})</span></span><span class="badge ${diffClass}">${esc(c.diff)}</span></div>
      <div class="statement">${esc(c.statement)}</div>
      <div class="io"><span class="lbl">Sample I/O</span><br>${esc(c.io)}</div>
      <button class="reveal-btn" onclick="toggleSolution('${sid}')">\u25B8 Reveal Reference Solution</button>
      <div class="solution" id="sol-${sid}">
        ${code(c.title, c.solution)}
        <div style="font-size:12.5px;color:var(--text-dim);"><b>Complexity:</b> ${esc(c.complexity)}</div>
      </div>
    </div>`;
  });
  html += `</section>`;
  return html;
}

/* SETUP LISTENERS */
document.querySelectorAll('.mode-btn').forEach(b=> b.addEventListener('click', ()=> setMode(b.dataset.mode)));
document.getElementById('search-input').addEventListener('input', e=> renderSidebar(e.target.value));
document.getElementById('menu-toggle').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
if (TOPICS.length){ state.activeTopic = TOPICS[0].id; }
renderSidebar('');
render();
</script>
</body>
</html>
